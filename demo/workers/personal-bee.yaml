# 🏡 PERSONAL BEE — tier 3: the user's personal agent, working on local data.
#
# Daily work runs on data that lives on the user's own machine — email, files,
# calendar, notes. This bee is the hive's door to that data. It advertises
# skills the planner tags personal work with (email, files, calendar,
# daily-report, personal), and because it bills `local` it is both dispatched
# ahead of any paid seat AND allowed to serve `sensitivity: confidential` tasks
# (allowedByConfidentiality permits local/free billing only). Personal data
# never leaves the premises.
#
# `agent:` names the harnessed agent this bee runs — the identity the Queen, the
# console and the logs use for it. It is a PREFERENCE, not a pin: the named agent
# goes first, and if it is missing on this host the rest of the chain still
# answers, with the substitution reported in the result's `runtime` (never
# silent). Available names:
#   hermes        — the `hermes` CLI (override the binary with $HERMES_CMD)
#   openclaw      — a local OpenAI-compatible gateway at $OPENCLAW_URL
#   personal-mini — the built-in mini agent: a local Ollama model over a
#                   sandboxed view of $PERSONAL_DATA_DIR (default demo/personal-data)
# Omit `agent:` to keep the historical order: openclaw, then hermes, then mini.
#
# `model:` is what the named agent is told to run. Hermes always advertises tools
# to the model, so pick a tool-capable one — gemma4 and qwen3.5 qualify. It stays
# advisory: $PERSONAL_MODEL overrides it, and a model this host has not pulled
# falls back to whatever Ollama does report.
#
# `bindGeneral: false` is load-bearing on the embedded MQTT broker: the local
# bee already owns tier-3 `general`, and Aedes has no shared subscriptions, so a
# second tier-3 bee binding `general` would double-deliver every general task.
# This bee therefore binds ONLY its own (disjoint) skills.
agentId: personal-bee-1
site: local
customerId: aiotlab
bindGeneral: false
capabilities:
  - agent: hermes           # the harnessed agent; preferred, not pinned
    runtime: personal       # dispatch key: selects the personal-agent adapter
    tier: 3
    billing: local          # zero marginal cost + confidential-allowed
    model: gemma4:12b       # advisory; must be tool-capable for hermes
    skills: [email, files, calendar, daily-report, personal]
    description: Your own agent over local personal data — email, files, calendar. Never leaves this machine.
