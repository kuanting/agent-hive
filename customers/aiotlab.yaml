# AIoT Lab — the default demo customer. Everything customer-specific lives here;
# the core hive packages stay customer-agnostic.
customerId: aiotlab
name: AIoT Lab

budget:
  # hard USD cap for per-token API spend
  capUsd: 50

# routing preference the Queen honors when no affordable adequate capability is free
policy:
  # what to do when a task can't get its ideal capability without spending:
  #   wait    -> hold the task and wait for a prepaid seat window to reset (full quality, higher latency)
  #   degrade -> run it now on a local model, result marked degraded (lower quality, no wait)
  # urgent tasks never wait regardless. omit this block to default to "wait".
  onBudgetBlock: wait

  # which way to lean when SEVERAL capabilities are adequate:
  #   cost-first       -> cheapest adequate one, escalate only after it fails (default)
  #   completion-first -> among capabilities that cost this customer nothing extra
  #                       (free tools, local models, seats already paid for), prefer
  #                       the most capable, so the job is likelier to finish on the
  #                       first attempt. Never reaches per-token billing, which stays
  #                       last and urgent-only — this knob cannot turn into a bill.
  # We optimize, we do not minimize: a cheaper route that does not finish is not
  # cheaper. Default stays cost-first until the episode log says otherwise.
  routing: cost-first

  # how much of each turn is written to data/episodes/*.jsonl, for refining the
  # planner later (see DESIGN.md §7, "measure before optimizing"):
  #   off      -> record nothing
  #   metadata -> decisions, tiers, tokens, timings, attempt chains; no user or
  #               model text ever reaches disk (default)
  #   tasks    -> the above plus each task's input, output and toolInput. NOT the
  #               user's message, the plan rationale, or the assistant's answer:
  #               a task's input is the work, those three are a conversation.
  #               This is the rung `npm run breed` needs — at metadata it can say
  #               how often work recurs and what it costs, and nothing else.
  #   full     -> the above plus the user message, plan rationale, and answer.
  #               The whole conversation on disk: opt in deliberately.
  # A turn containing ANY confidential task is recorded as metadata regardless,
  # and confidential rows are excluded from the breeding corpus entirely.
  recordEpisodes: metadata

# subscription seats shared across the lab's workers (prepaid; metered in tokens per rolling window)
seats:
  - seatId: claude-max-1
    windowSeconds: 18000          # 5-hour rolling window
    tokensPerWindow: 2000000
  - seatId: chatgpt-pro-1
    windowSeconds: 18000
    tokensPerWindow: 2000000
  - seatId: ollama-cloud-1
    windowSeconds: 3600
    tokensPerWindow: 1000000

# tier-4 tools enabled for this customer (Queen-side match metadata)
tools:
  - toolId: csv-report
    skills: [reporting]
    requiredKeys: [csv]
  - toolId: log-extract
    skills: [reporting, ops]
    requiredKeys: [pattern]
